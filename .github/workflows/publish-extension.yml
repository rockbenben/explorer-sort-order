name: Publish VSCode Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Publish Extension
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
